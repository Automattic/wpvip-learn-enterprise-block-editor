name: '🔍 Static Linting'

on:
    push:
        branches: [trunk]
    pull_request:
        branches: [trunk]
    workflow_dispatch:

jobs:
    lint:
        uses: ./.github/workflows/_ci-setup.yml
        with:
            install-php: true
            install-composer: true
        secrets: inherit

    run-linting:
        needs: lint
        runs-on: ubuntu-latest
        steps:
            # Download the workspace artifact from the previous job
            # This ensures we have access to all installed dependencies and setup
            # Without this, we would start with a fresh workspace in each job
            - name: Download workspace
              uses: actions/download-artifact@v3
              with:
                  name: workspace
                  path: .

            - name: Run PHP linting
              run: composer run lint

            - name: Run JavaScript linting
              run: npm run lint:js

            - name: Run CSS linting
              run: npm run lint:css
